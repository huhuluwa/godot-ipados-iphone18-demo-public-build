name: iOS build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios-unsigned:
    name: Export and archive unsigned iOS app
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Download Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/godot.zip" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          echo 'c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e  '"$RUNNER_TEMP/godot.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          echo "GODOT_BIN=$(find "$RUNNER_TEMP/godot" -type f -path '*Godot*.app/Contents/MacOS/Godot' -print -quit)" >> "$GITHUB_ENV"

      - name: Install Godot export templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/templates.tpz" \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          echo 'f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011  '"$RUNNER_TEMP/templates.tpz" | shasum -a 256 -c -
          unzip -q -o "$RUNNER_TEMP/templates.tpz" -d "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"

      - name: Export Xcode project
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --export-release "iOS" "$GITHUB_WORKSPACE/build/ios"

      - name: Archive without signing
        shell: bash
        run: |
          set -euo pipefail
          PROJECT=$(find build/ios -maxdepth 2 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme "Godot iOS Port Harness" -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -archivePath "$GITHUB_WORKSPACE/build/GodotHarness.xcarchive" archive \
            | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Package unsigned IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/GodotHarness.xcarchive/Products/Applications -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          (cd build && zip -qry GodotHarness-unsigned.ipa Payload)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: |
            build/GodotHarness-unsigned.ipa
            build/GodotHarness.xcarchive
            build/xcodebuild.log
            build/ios

