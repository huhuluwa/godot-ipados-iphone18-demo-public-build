workflows:
  ios-godot-editor-source-unsigned:
    name: Godot 4.7.2 iOS/iPadOS editor source build
    instance_type: mac_mini_m2
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    environment:
      xcode: latest
    scripts:
      - name: Fetch official Godot 4.7.2 source
        script: |
          set -euo pipefail
          ENGINE_DIR="$CM_BUILD_DIR/godot-engine"
          SOURCE_TMP="$CM_BUILD_DIR/godot-source-tmp"
          mkdir -p "$SOURCE_TMP"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://codeload.github.com/godotengine/godot/tar.gz/refs/tags/4.7.2-stable" \
            --output "$SOURCE_TMP/godot-4.7.2-stable.tar.gz"
          tar -xzf "$SOURCE_TMP/godot-4.7.2-stable.tar.gz" -C "$SOURCE_TMP"
          mv "$SOURCE_TMP/godot-4.7.2-stable" "$ENGINE_DIR"
          printf '%s\n' 'ed1daf0bf001b61586d9930840f2f1394092c079' | tee "$CM_BUILD_DIR/godot-source-revision.txt"
          git -C "$ENGINE_DIR" apply "$CM_BUILD_DIR/engine-patches/0001-ios-editor-bundle.patch"
          git -C "$ENGINE_DIR" apply "$CM_BUILD_DIR/engine-patches/0002-ios-editor-mono-configure.patch"
          git -C "$ENGINE_DIR" apply "$CM_BUILD_DIR/engine-patches/0003-ios-editor-coreclr-host.patch"
          git -C "$ENGINE_DIR" apply "$CM_BUILD_DIR/engine-patches/0004-ios-editor-library-suffix.patch"
          python3 - "$ENGINE_DIR/modules/mono/build_scripts/mono_configure.py" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text()
          marker = '        if env["platform"] == "ios":\n            return\n'
          if marker not in text:
              needle = '    if env.editor_build:\n'
              if needle not in text:
                  raise SystemExit("iOS Mono editor guard insertion point not found")
              text = text.replace(needle, needle + marker, 1)
              path.write_text(text)
          PY
          grep -n -A5 'if env.editor_build:' "$ENGINE_DIR/modules/mono/build_scripts/mono_configure.py"
      - name: Install SCons
        script: |
          set -euo pipefail
          python3 -m pip install --user --upgrade scons
          USER_BASE="$(python3 -c 'import site; print(site.getuserbase())')"
          export PATH="$USER_BASE/bin:$PATH"
          scons --version
          echo "PATH=$PATH" >> "$CM_ENV"
      - name: Build editor library and Apple Embedded Xcode bundle
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/godot-engine"
          scons --jobs="$(sysctl -n hw.ncpu)" \
            platform=ios target=editor arch=arm64 \
            generate_bundle=yes \
            metal=yes vulkan=no opengl3=no \
            tests=no module_mono_enabled=yes module_text_server_fb_enabled=yes dev_build=no \
            2>&1 | tee "$CM_BUILD_DIR/godot-scons.log"
          BUNDLE_PATH=$(find bin -maxdepth 1 -type f -name 'godot_ios*.zip' -print -quit)
          test -n "$BUNDLE_PATH"
          printf '%s\n' "$BUNDLE_PATH" | tee "$CM_BUILD_DIR/ios-editor-bundle-path.txt"
      - name: Generate official Mono glue with host editor
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/godot-engine"
          scons --jobs="$(sysctl -n hw.ncpu)" \
            platform=macos target=editor arch=arm64 \
            metal=yes vulkan=no opengl3=no \
            tests=no module_mono_enabled=yes module_text_server_fb_enabled=yes dev_build=no \
            2>&1 | tee "$CM_BUILD_DIR/godot-macos-host-scons.log"
          MACOS_GODOT="$CM_BUILD_DIR/godot-engine/bin/godot.macos.editor.arm64.mono"
          test -x "$MACOS_GODOT"
          "$MACOS_GODOT" --headless --editor \
            --generate-mono-glue "$CM_BUILD_DIR/godot-engine/modules/mono/glue" \
            2>&1 | tee "$CM_BUILD_DIR/godot-mono-glue.log"
          test -f modules/mono/glue/GodotSharp/GodotSharp/Generated/GeneratedIncludes.props
      - name: Build official Godot .NET assemblies
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR/godot-engine"
          DOTNET_DIR="$CM_BUILD_DIR/dotnet"
          curl --fail --location --silent --show-error \
            https://dot.net/v1/dotnet-install.sh \
            --output "$CM_BUILD_DIR/dotnet-install.sh"
          bash "$CM_BUILD_DIR/dotnet-install.sh" \
            --channel 8.0 \
            --quality ga \
            --architecture arm64 \
            --install-dir "$DOTNET_DIR" \
            --no-path
          export PATH="$DOTNET_DIR:$PATH"
          echo "PATH=$PATH" >> "$CM_ENV"
          dotnet --info 2>&1 | tee "$CM_BUILD_DIR/dotnet-info.log"
          python3 modules/mono/build_scripts/build_assemblies.py \
            --godot-output-dir bin \
            --godot-platform ios \
            2>&1 | tee "$CM_BUILD_DIR/godot-dotnet-build.log"
          test -f bin/GodotSharp/Api/Debug/GodotSharp.dll
          test -f bin/GodotSharp/Api/Debug/GodotSharpEditor.dll
          test -f bin/GodotSharp/Api/Debug/GodotPlugins.dll
          test -f bin/GodotSharp/Api/Debug/GodotPlugins.runtimeconfig.json
          test -f bin/GodotSharp/Tools/GodotTools.dll
      - name: Download .NET 11 iOS CoreCLR runtime pack
        script: |
          set -euo pipefail
          RUNTIME_VERSION="11.0.0"
          RUNTIME_URL="https://api.nuget.org/v3-flatcontainer/microsoft.netcore.app.runtime.ios-arm64/${RUNTIME_VERSION}/microsoft.netcore.app.runtime.ios-arm64.${RUNTIME_VERSION}.nupkg"
          RUNTIME_ARCHIVE="$CM_BUILD_DIR/microsoft.netcore.app.runtime.ios-arm64.nupkg"
          curl --fail --location --silent --show-error "$RUNTIME_URL" --output "$RUNTIME_ARCHIVE"
          rm -rf "$CM_BUILD_DIR/dotnet-ios-runtime"
          mkdir -p "$CM_BUILD_DIR/dotnet-ios-runtime"
          unzip -q "$RUNTIME_ARCHIVE" -d "$CM_BUILD_DIR/dotnet-ios-runtime"
          RUNTIME_ROOT="$CM_BUILD_DIR/dotnet-ios-runtime/runtimes/ios-arm64"
          test -f "$RUNTIME_ROOT/native/libcoreclr.dylib"
          test -f "$RUNTIME_ROOT/lib/net11.0/System.Private.CoreLib.dll"
          echo "DOTNET_IOS_RUNTIME_ROOT=$RUNTIME_ROOT" >> "$CM_ENV"
          find "$RUNTIME_ROOT" -maxdepth 3 -type f | sort | tee "$CM_BUILD_DIR/dotnet-ios-runtime-files.log"
      - name: Prepare unsigned iOS editor Xcode project
        script: |
          set -euo pipefail
          BUNDLE_PATH=$(cat "$CM_BUILD_DIR/ios-editor-bundle-path.txt")
          test -f "$CM_BUILD_DIR/godot-engine/$BUNDLE_PATH"
          python3 "$CM_BUILD_DIR/scripts/package_ios_editor.py" \
            "$CM_BUILD_DIR/godot-engine/$BUNDLE_PATH" \
            "$CM_BUILD_DIR/ios-editor-xcode" \
            "$CM_BUILD_DIR/godot-engine/bin"
          find "$CM_BUILD_DIR/ios-editor-xcode/GodotEditor.xcframework" -maxdepth 2 -type f -print | sort | tee "$CM_BUILD_DIR/ios-editor-framework-files.log"
          test -f "$CM_BUILD_DIR/ios-editor-xcode/GodotEditor.xcframework/ios-arm64/libgodot.a"
          test -f "$CM_BUILD_DIR/ios-editor-xcode/godot_apple_embedded.xcodeproj/project.pbxproj"
          xcodebuild -project "$CM_BUILD_DIR/ios-editor-xcode/godot_apple_embedded.xcodeproj" -list \
            2>&1 | tee "$CM_BUILD_DIR/xcode-project-list.log"
      - name: Build unsigned iOS editor archive
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/build"
          xcodebuild \
            -project "$CM_BUILD_DIR/ios-editor-xcode/godot_apple_embedded.xcodeproj" \
            -scheme GodotEditor \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -archivePath "$CM_BUILD_DIR/build/GodotEditor.xcarchive" archive \
            2>&1 | tee "$CM_BUILD_DIR/xcodebuild-editor.log"
      - name: Package unsigned editor IPA
        script: |
          set -euo pipefail
          APP=$(find "$CM_BUILD_DIR/build/GodotEditor.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          MANAGED_SOURCE="$CM_BUILD_DIR/godot-engine/bin/GodotSharp"
          test -d "$MANAGED_SOURCE"
          rm -rf "$APP/GodotSharp"
          cp -R "$MANAGED_SOURCE" "$APP/GodotSharp"
          RUNTIME_ROOT="$DOTNET_IOS_RUNTIME_ROOT"
          mkdir -p "$APP/Frameworks"
          cp "$RUNTIME_ROOT/native/"*.dylib "$APP/Frameworks/"
          cp "$RUNTIME_ROOT/lib/net11.0/"*.dll "$APP/GodotSharp/Api/Debug/"
          cp "$RUNTIME_ROOT/lib/net11.0/Microsoft.NETCore.App.deps.json" "$APP/GodotSharp/Api/Debug/"
          cp "$RUNTIME_ROOT/lib/net11.0/Microsoft.NETCore.App.runtimeconfig.json" "$APP/GodotSharp/Api/Debug/"
          test -f "$APP/Frameworks/libcoreclr.dylib"
          test -f "$APP/Frameworks/libclrjit.dylib"
          test -f "$APP/GodotSharp/Api/Debug/System.Private.CoreLib.dll"
          test -f "$APP/GodotSharp/Api/Debug/GodotSharp.dll"
          test -f "$APP/GodotSharp/Api/Debug/GodotSharpEditor.dll"
          test -f "$APP/GodotSharp/Api/Debug/GodotPlugins.dll"
          test -f "$APP/GodotSharp/Api/Debug/GodotPlugins.runtimeconfig.json"
          test -f "$APP/GodotSharp/Tools/GodotTools.dll"
          rm -rf "$CM_BUILD_DIR/build/unsigned-ipa"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/unsigned-ipa/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$CM_BUILD_DIR/build/unsigned-ipa/Payload" \
            "$CM_BUILD_DIR/build/Godot-4.7.2-iPadOS-editor-unsigned.ipa"
      - name: Verify editor IPA contents
        script: |
          set -euo pipefail
          python3 "$CM_BUILD_DIR/scripts/verify_ios_editor_ipa.py" \
            "$CM_BUILD_DIR/build/Godot-4.7.2-iPadOS-editor-unsigned.ipa" \
            | tee "$CM_BUILD_DIR/ios-editor-ipa-verification.log"
    artifacts:
      - build/*.ipa
      - build/**/*.xcarchive
      - godot-source-revision.txt
      - godot-scons.log
      - godot-macos-host-scons.log
      - godot-mono-glue.log
      - xcode-project-list.log
      - dotnet-info.log
      - godot-dotnet-build.log
      - ios-editor-framework-files.log
      - dotnet-ios-runtime-files.log
      - xcodebuild-editor.log
      - ios-editor-ipa-verification.log
    publishing:
      email:
        recipients:
          - zhengyi2323@gmail.com
        notify:
          success: true
          failure: true
