workflows:
  ios-unsigned-export:
    name: Godot iOS Xcode export (unsigned)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Download Godot 4.7.2
        script: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          export GODOT_BIN="$(find /tmp/godot -type f -path '*Godot*.app/Contents/MacOS/Godot' -o -type f -name Godot | head -n 1)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"
      - name: Download export templates
        script: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q -o /tmp/templates.tpz -d "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
      - name: Export Xcode project
        script: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --export-release "iOS" "$CM_BUILD_DIR/export/ios"
      - name: Build unsigned archive
        script: |
          set -euo pipefail
          PROJECT=$(find "$CM_BUILD_DIR/export/ios" -maxdepth 2 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          xcodebuild -project "$PROJECT" -scheme "Godot iOS Port Harness" -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -archivePath "$CM_BUILD_DIR/build/harness.xcarchive" archive
    artifacts:
      - export/ios/**/*
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

  ios-signed-release:
    name: Godot iOS signed IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: GODOT_IOS_ASC
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.huhuluwa.godotipadosiphone18demo
      groups:
        - godot_ios
    scripts:
      - name: Validate Apple Team ID
        script: |
          set -euo pipefail
          test "${APPLE_TEAM_ID:-}" != ""
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path("export_presets.cfg")
          s = p.read_text()
          s = s.replace('application/app_store_team_id="AAAAAAAAAA"', f'application/app_store_team_id="{os.environ["APPLE_TEAM_ID"]}"')
          p.write_text(s)
          PY
      - name: Download Godot and export Xcode project
        script: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          GODOT_BIN="$(find /tmp/godot -type f -path '*Godot*.app/Contents/MacOS/Godot' -o -type f -name Godot | head -n 1)"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 --output /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          unzip -q -o /tmp/templates.tpz -d "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --export-release "iOS" "$CM_BUILD_DIR/export/ios"
      - name: Set up iOS code signing
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: |
          set -euo pipefail
          PROJECT=$(find "$CM_BUILD_DIR/export/ios" -maxdepth 2 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          xcode-project build-ipa --project "$PROJECT" --scheme "Godot iOS Port Harness"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

