workflows:
  ios-unsigned-export:
    name: Godot iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Download Godot 4.7.2
        script: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_macos.universal.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          export GODOT_BIN="$(find /tmp/godot -type f -path '*Godot*.app/Contents/MacOS/Godot' -o -type f -name Godot | head -n 1)"
          test -x "$GODOT_BIN"
          echo "GODOT_BIN=$GODOT_BIN" >> "$CM_ENV"
      - name: Download export templates
        script: |
          set -euo pipefail
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable"
          curl --fail --location --retry 3 \
            --output /tmp/templates.tpz \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q -o /tmp/templates.tpz -d /tmp/godot-templates
          cp -R /tmp/godot-templates/templates/. "$HOME/Library/Application Support/Godot/export_templates/4.7.2.stable/"
      - name: Export Xcode project
        script: |
          set -euo pipefail
          mkdir -p "$CM_BUILD_DIR/export/ios"
          "$GODOT_BIN" --headless --path "$CM_BUILD_DIR" --export-release "iOS" "$CM_BUILD_DIR/export/ios"
      - name: Build unsigned archive
        script: |
          set -euo pipefail
          PROJECT=$(find "$CM_BUILD_DIR/export/ios" -maxdepth 2 -name '*.xcodeproj' -print -quit)
          test -n "$PROJECT"
          mkdir -p "$CM_BUILD_DIR/build"
          mkdir -p /tmp/xcodebuild_logs
          xcodebuild -project "$PROJECT" -list 2>&1 | tee /tmp/xcodebuild_logs/project-list.log
          LIST_STATUS=${PIPESTATUS[0]}
          test "$LIST_STATUS" -eq 0
          SCHEME=$(awk '/Schemes:/{capture=1; next} capture && /^[[:space:]]*[^[:space:]]/{sub(/^[[:space:]]+/, ""); print; exit}' /tmp/xcodebuild_logs/project-list.log)
          test -n "$SCHEME"
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            -archivePath "$CM_BUILD_DIR/build/harness.xcarchive" archive 2>&1 | tee /tmp/xcodebuild_logs/archive.log
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP=$(find "$CM_BUILD_DIR/build/harness.xcarchive/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          rm -rf "$CM_BUILD_DIR/build/unsigned-ipa"
          mkdir -p "$CM_BUILD_DIR/build/unsigned-ipa/Payload"
          cp -R "$APP" "$CM_BUILD_DIR/build/unsigned-ipa/Payload/"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent \
            "$CM_BUILD_DIR/build/unsigned-ipa/Payload" \
            "$CM_BUILD_DIR/build/Godot-iOS-unsigned.ipa"
    artifacts:
      - build/*.ipa
      - export/ios/**/*
      - build/**/*.xcarchive
      - /tmp/xcodebuild_logs/*.log

