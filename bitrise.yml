format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: other

workflows:
  primary:
    title: Godot 4.7.2 iPadOS Mono/C# unsigned editor
    description: Build the official Godot source with Mono/C# and package an unsigned iPadOS editor IPA.
    max_build_duration: 90
    meta:
      bitrise.io:
        stack: osx-xcode-latest-stable
    steps:
    - script:
        title: Build unsigned Mono/C# iPadOS editor
        inputs:
        - content: |-
            set -euo pipefail
            bash "$BITRISE_SOURCE_DIR/scripts/build_ios_mono_bitrise.sh"
    - deploy-to-bitrise-io:
        inputs:
        - deploy_path: "$BITRISE_BUILD_DIR/Godot-4.7.2-iPadOS-editor-unsigned.ipa"
